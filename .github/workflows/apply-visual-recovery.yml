name: Apply Visual Recovery

on:
  push:
    branches:
      - recovery/visual-regression-20260820

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/visual-regression-20260820
          fetch-depth: 0

      - name: Apply approved visual recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('assets/css/ibtikar-shell.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* === APPROVED VISUAL RECOVERY 2026-08-20 === */'
          if marker not in css:
              css += r'''

/* === APPROVED VISUAL RECOVERY 2026-08-20 ===
   Restores the approved flat/clean shell without reverting newer content,
   accessibility, service cleanup, or responsive behavior. */

/* Header: no floating card border/shadow. Keep the shell readable over the page. */
.ibt-shell-header,
.header.ibt-shell-header,
.site-header.ibt-shell-header {
  top: 0;
  padding-inline: 0;
  background: color-mix(in srgb, var(--ibt-bg) 86%, transparent) !important;
  border: 0 !important;
  box-shadow: none !important;
  backdrop-filter: blur(18px) saturate(1.2);
}

.ibt-shell-nav,
.nav.ibt-shell-nav,
.nav-shell.ibt-shell-nav,
html[data-theme="dark"] .ibt-shell-nav {
  width: min(calc(100% - 40px), var(--ibt-container));
  height: var(--ibt-header-h);
  margin-inline: auto;
  padding-inline: 0;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  backdrop-filter: none !important;
  box-shadow: none !important;
}

.ibt-shell-header.scrolled .ibt-shell-nav,
.ibt-shell-header.is-scrolled .ibt-shell-nav {
  transform: none;
  border-color: transparent !important;
  box-shadow: none !important;
}

/* Desktop navigation: restore the clean text navigation rather than a nested pill. */
.ibt-shell-desktop-nav,
.desktop-nav.ibt-shell-desktop-nav,
.nav-links.ibt-shell-desktop-nav {
  padding: 0;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.ibt-shell-nav-link,
.ibt-shell-desktop-nav > a {
  min-height: 42px;
  border-radius: 10px;
}

/* Mobile trigger: approved four-dot icon. Drawer behavior remains unchanged. */
.ibt-shell-menu-toggle,
.menu-toggle.ibt-shell-menu-toggle,
.menu-btn.ibt-shell-menu-toggle {
  border: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.ibt-shell-menu-toggle span,
.menu-toggle.ibt-shell-menu-toggle span,
.menu-btn.ibt-shell-menu-toggle span {
  display: none !important;
}

.ibt-shell-menu-toggle::before,
.menu-toggle.ibt-shell-menu-toggle::before,
.menu-btn.ibt-shell-menu-toggle::before {
  content: "";
  width: 20px;
  height: 20px;
  display: block;
  background:
    radial-gradient(circle at 5px 5px, currentColor 0 2.2px, transparent 2.4px),
    radial-gradient(circle at 15px 5px, currentColor 0 2.2px, transparent 2.4px),
    radial-gradient(circle at 5px 15px, currentColor 0 2.2px, transparent 2.4px),
    radial-gradient(circle at 15px 15px, currentColor 0 2.2px, transparent 2.4px);
}

/* Keep the approved hero composition and prevent shell overlap. */
body.source-home #home.hero {
  scroll-margin-top: var(--ibt-header-h);
}

/* The Journey should begin with its content, not an extra Ibtikar-system badge. */
body.source-home .cinematic-story__brand {
  display: none !important;
}

@media (max-width: 760px) {
  .ibt-shell-header { top: 0; padding-inline: 0; }
  .ibt-shell-nav { width: min(calc(100% - 28px), var(--ibt-container)); }
}
'''
              css_path.write_text(css, encoding='utf-8')

          # Remove the active Journey brand markup itself rather than only hiding it.
          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index2 = re.sub(
              r'\s*<div class="cinematic-story__brand"><span aria-hidden="true" class="cinematic-story__mark"><i></i><i></i><i></i></span><span>منظومة ابتكار تك</span></div>',
              '',
              index,
              count=1,
          )
          if index2 != index:
              index_path.write_text(index2, encoding='utf-8')

          # Permanent QA assertions for the recovered shell and Journey.
          qa_path = Path('scripts/recovery-visual-qa.cjs')
          qa_path.write_text(r'''const fs = require('fs');
const assert = require('assert');

const shell = fs.readFileSync('assets/css/ibtikar-shell.css', 'utf8');
const home = fs.readFileSync('index.html', 'utf8');

assert(shell.includes('APPROVED VISUAL RECOVERY 2026-08-20'), 'recovery CSS layer missing');
assert(shell.includes('radial-gradient(circle at 5px 5px'), 'four-dot mobile menu icon missing');
assert(/\.ibt-shell-nav[\s\S]*?border:\s*0\s*!important/.test(shell.slice(shell.indexOf('APPROVED VISUAL RECOVERY'))), 'flat header border override missing');
assert(/\.ibt-shell-nav[\s\S]*?box-shadow:\s*none\s*!important/.test(shell.slice(shell.indexOf('APPROVED VISUAL RECOVERY'))), 'flat header shadow override missing');
assert(home.includes('نبني منظومة رقمية'), 'approved hero H1 missing');
assert(home.includes('ابدأ بتشخيص مشروعك'), 'secondary hero CTA missing');
assert(home.includes('استكشف منظومة الحلول'), 'primary hero CTA missing');
assert(home.includes('hero-dashboard hero-system-stage'), 'two-column hero visual stage missing');
assert(!home.includes('<div class="cinematic-story__brand"><span aria-hidden="true" class="cinematic-story__mark"'), 'Journey brand badge still active');
assert(home.includes('نبني منظومة واحدة'), 'Journey heading missing');
console.log('Recovery visual QA: 10/10 passed');
''', encoding='utf-8')
          PY

      - name: Run existing and recovery QA
        shell: bash
        run: |
          set -e
          node --check assets/js/ibtikar-shell.js
          node --check assets/js/page-shell.js
          node --check assets/js/source-home.js
          node scripts/recovery-visual-qa.cjs
          node scripts/static-qa.cjs
          node scripts/interaction-qa.cjs

      - name: Commit recovery changes to branch
        shell: bash
        run: |
          set -e
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No recovery changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/ibtikar-shell.css index.html scripts/recovery-visual-qa.cjs
          git commit -m 'fix: restore approved header and homepage shell'
          git push origin HEAD:recovery/visual-regression-20260820
