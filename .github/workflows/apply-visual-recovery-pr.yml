name: Apply Visual Recovery PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'recovery/visual-regression-20260820' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/visual-regression-20260820
          fetch-depth: 0

      - name: Apply deterministic recovery
        run: python3 scripts/apply-visual-recovery.py

      - name: Run deterministic recovery QA
        run: |
          set -e
          node --check assets/js/ibtikar-shell.js
          node --check assets/js/page-shell.js
          node --check assets/js/source-home.js
          node scripts/recovery-visual-qa.cjs
          node scripts/static-qa.cjs

      - name: Commit recovery result
        run: |
          set -e
          if git diff --quiet; then
            echo 'No recovery changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/ibtikar-shell.css index.html scripts/recovery-visual-qa.cjs
          git commit -m 'fix: restore approved header and homepage shell'
          git push origin HEAD:recovery/visual-regression-20260820
